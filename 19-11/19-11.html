<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="/styles/style.css" />
  <link rel="stylesheet" href="/styles/buttonsStyle.css" />
  <link rel="stylesheet" href="/styles/listStyle.css" />
  <link rel="stylesheet" href="/styles/mediaStyle.css" />
  <link rel="stylesheet" href="/styles/inputStyle.css" />
  <link rel="stylesheet" href="/styles/messageStyle.css" />
</head>
<body>
  <h1>Cosa bisogna fare oggi?</h1>
  <input type="text" id="input" placeholder="Aggiungi attività" required />
  <span id="errorInput" class="message-error" style="display:none;">Inserisci un'attività</span>
  <button id="addBtn">Aggiungi</button>
  <br>
  <br>
  <div id="buttons">
    <button id="deleteBtn">Cancella tutto</button>
    <button id="completed">Cosa hai fatto?</button>
    <button id="notCompleted">Cosa devi fare?</button>
    <button id="showAll">Mostra tutte</button>
  </div>
  <p id="message">Nessuna attività inserita</p>
  <ul class="list"></ul>
  <script src="script.js"></script>
</body>
</html>
