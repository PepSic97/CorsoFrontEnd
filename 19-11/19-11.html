<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Lista delle attività</h1>

  <input type="text" id="inputAttivita" placeholder="Aggiungi attività..." />
  <button id="aggiungiBtn">Aggiungi</button>
  <button id="svuotaBtn">Svuota lista</button>
  <button id="filtraCompletate">Mostra solo completate</button>
  <button id="mostraTutte">Mostra tutte</button>

  <p id="messaggio">Nessuna attività inserita</p>

  <ul class="lista"></ul>

  <script src="script.js"></script>
</body>
</html>
