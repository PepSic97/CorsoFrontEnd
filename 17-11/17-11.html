<!DOCTYPE html>
<html>
  <head><title>Calcolatrice</title></head>
  <link rel="stylesheet" href="styles.css">
<body>
  <div class="calcolatrice">
    <h1>Calcolatrice</h1>
    <p>Scegli quale operazione eseguire</p>
    <input id="n1" type="number" placeholder="Numero 1"/>
    <br>
    <input id="n2" type="number" placeholder="Numero 2"/>
    <br>
    <br>
    <button onclick="calcola(1)">Somma</button>
    <button onclick="calcola(2)">Sottrai</button>
    <button onclick="calcola(3)">Moltiplica</button>
    <button onclick="calcola(4)">Dividi</button>

    <p id="risultato"></p>

    <button id="reset" onclick="resetta()">Resetta</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
