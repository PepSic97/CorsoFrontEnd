<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Generatore di Schede Utente</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="container">
      <h1>Generatore di Schede Utente</h1>

      <input id="nome" placeholder="Nome" required/>
      <input id="eta" type="number" placeholder="Età" required/>
      <input id="professione" placeholder="Professione" required/>
      <button id="aggiungi">Aggiungi utente</button>

      <h2>Lista utenti</h2>
      <div id="lista"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
